# =============================================================================
# GEON — Grafana Provisioning: Operational Alerting
#
# Alerts on the PIPELINE itself (silent ingestion stalls, job failures) —
# the domain alerts (new correlations) are sent directly by the
# correlation engine. Notifications go to the GEON Discord webhook
# (DISCORD_WEBHOOK_URL env var, injected by docker-compose).
# =============================================================================

apiVersion: 1

contactPoints:
  - orgId: 1
    name: geon-discord
    receivers:
      - uid: geon-discord-webhook
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: geon-discord
    group_by: ['grafana_folder', 'alertname']
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 12h

# Purge our rules before (re)provisioning them — half-provisioned state
# from an interrupted boot otherwise collides on rule titles.
deleteRules:
  - orgId: 1
    uid: geon-gdelt-stalled
  - orgId: 1
    uid: geon-correlation-stalled
  - orgId: 1
    uid: geon-job-failures

groups:
  - orgId: 1
    name: geon-operational
    folder: GEON
    interval: 5m
    rules:
      # -----------------------------------------------------------------
      # GDELT ingestion stalled — cadence is 15 min; alert after 1 h
      # without a successful run. No data (ingestor down) also alerts.
      # -----------------------------------------------------------------
      - uid: geon-gdelt-stalled
        title: GDELT ingestion stalled
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No successful GDELT ingestion for more than 1 hour
            (normal cadence: every 15 minutes).
        labels:
          team: geon
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: time() - geon_job_last_success_timestamp_seconds{job="gdelt"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3600] }

      # -----------------------------------------------------------------
      # Correlation engine stalled — cadence is 30 min; alert after 2 h.
      # -----------------------------------------------------------------
      - uid: geon-correlation-stalled
        title: Correlation engine stalled
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No successful correlation run for more than 2 hours
            (normal cadence: every 30 minutes).
        labels:
          team: geon
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: time() - geon_job_last_success_timestamp_seconds{job="correlation"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [7200] }

      # -----------------------------------------------------------------
      # Job failures — any ingestion/correlation job failing in the last
      # hour fires one alert per job label.
      # -----------------------------------------------------------------
      - uid: geon-job-failures
        title: Ingestion job failures
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            One or more GEON jobs failed during the last hour
            (job label identifies which).
        labels:
          team: geon
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum by (job) (increase(geon_job_runs_total{status="failure"}[1h]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
