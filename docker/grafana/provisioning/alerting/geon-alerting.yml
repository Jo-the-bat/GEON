# =============================================================================
# GEON — Grafana Provisioning: Operational Alerting
#
# Alerts on the PIPELINE itself (silent ingestion stalls, job failures) —
# the domain alerts (new correlations) are sent directly by the
# correlation engine. Notifications go to the GEON Discord webhook
# (DISCORD_WEBHOOK_URL env var, injected by docker-compose).
#
# NOTE: a single combined rule on purpose. Grafana 10.4.15's file
# provisioning has a broken uniqueness check: ANY second alert rule in
# the provisioning files fails with a spurious "conflicting alert rule
# found ... title should be unique" (verified empirically: positional,
# regardless of titles/groups/folders). The `or` of bool comparisons
# yields one alert INSTANCE per cause (labels keep the job), so the
# granularity survives. Revisit after upgrading Grafana (>= 11).
# =============================================================================

apiVersion: 1

contactPoints:
  - orgId: 1
    name: geon-discord
    receivers:
      - uid: geon-discord-webhook
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: geon-discord
    group_by: ['grafana_folder', 'alertname']
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 12h

# Self-clean: remove the rules from earlier provisioning attempts (the
# three-rule layout) and any half-provisioned state.
deleteRules:
  - orgId: 1
    uid: geon-gdelt-stalled
  - orgId: 1
    uid: geon-correlation-stalled
  - orgId: 1
    uid: geon-job-failures

groups:
  - orgId: 1
    name: geon-operational
    folder: GEON
    interval: 5m
    rules:
      # -----------------------------------------------------------------
      # Pipeline health — one rule, one alert instance per cause:
      #   {job="gdelt"}       no successful run for > 1 h (cadence 15 min)
      #   {job="correlation"} no successful run for > 2 h (cadence 30 min)
      #   {job=...}           any job failure during the last hour
      # The ingestor being down entirely -> NoData -> also alerts.
      # -----------------------------------------------------------------
      - uid: geon-pipeline-health
        title: GEON pipeline stalled or failing
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            GEON pipeline issue on {{ $labels.job }} — ingestion stalled
            or job failures in the last hour. Check the ingestor logs and
            the Prometheus geon_job_* metrics.
        labels:
          team: geon
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                ((time() - geon_job_last_success_timestamp_seconds{job="gdelt"}) > bool 3600)
                or ((time() - geon_job_last_success_timestamp_seconds{job="correlation"}) > bool 7200)
                or (sum by (job) (increase(geon_job_runs_total{status="failure"}[1h])) > bool 0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
