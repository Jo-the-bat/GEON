[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "landing",
    "n8n/workflows",
    "docker",
]

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes core.
# I:       isort (import ordering).
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests often import without-using or shadow-imports.
"tests/*" = ["F401"]
# Embedded SIPRI seed rows are tabular data — wrapping them hurts more
# than the long lines do.
"ingestors/sipri/ingestor.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
