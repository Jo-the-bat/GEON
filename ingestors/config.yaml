# =============================================================================
# GEON — Tunable analytics settings
#
# Correlation-rule thresholds, engine behaviour, alerting and risk-score
# weights. Loaded by ingestors/common/settings.py; every value has the same
# default in code, so removing a key falls back to the historical behaviour.
#
# After changing this file: rebuild + restart the ingestor container
#   docker compose -f docker/docker-compose.yml build ingestor
#   docker compose -f docker/docker-compose.yml up -d --no-deps ingestor
# =============================================================================

correlation:
  engine:
    # A situation dormant for this many days that fires again is treated
    # as a reactivation and re-alerted.
    reactivation_days: 14
    # Cap on merged situation timelines (oldest half + newest half kept).
    timeline_max_entries: 50
    # Minimum severity that triggers notifications: low|medium|high|critical
    min_alert_severity: high
    # Cap on merged evidence references per situation document.
    evidence_max_entries: 20

  # Per-subject statistical baselines (deviation from each country/pair's
  # own history instead of one absolute threshold for everyone).
  baselines:
    baseline_days: 90
    min_baseline_days: 21
    std_floor: 1.0

  # Rule 1 — diplomatic escalation + APT activity
  diplomatic_apt:
    goldstein_threshold: -5.0
    lookback_days: 7
    apt_window_days: 30
    # Statistical gating: the pair's negative-event rate must deviate
    # from ITS OWN baseline (z-score) — chronically tense pairs no longer
    # fire on their normal background level. Falls back to the absolute
    # behaviour when the pair has insufficient history.
    use_baseline: true
    zscore_threshold: 2.0

  # Rule 2 — sanction + IoC spike
  sanction_cyber:
    lookback_days: 14
    ioc_window_days: 60
    ioc_spike_threshold: 2.0      # 2.0 = +200%
    min_baseline_count: 10

  # Rule 3 — armed conflict + cyber activity
  conflict_cyber:
    lookback_days: 14
    cyber_window_days: 30
    conflict_event_types:
      - "Battles"
      - "Violence against civilians"
      - "Explosions/Remote violence"

  # Rule 4 — rhetoric shift (weak signal)
  rhetoric_shift:
    short_window_days: 7
    long_window_days: 30
    stddev_threshold: 2.0
    min_articles: 10
    # Tone-std floor (first backtest finding: syndicated articles give
    # near-zero variance and z > 26000).
    std_floor: 1.0

  # Rule 5 — internet outage + escalation
  internet_outage:
    window_hours: 48
    goldstein_threshold: -5.0

  # Rule 6 — military spending surge + APT
  military_buildup:
    yoy_threshold: 10.0           # percent

  # Rule 7 — arms transfer + regional escalation
  arms_escalation:
    goldstein_threshold: -3.0
    escalation_window_days: 90
    escalation_threshold_pct: 50.0

  # Rule 8 — prediction market movement + real-world event
  prediction_validated:
    price_shift_threshold: 0.10   # 10%
    goldstein_severity: 7.0
    window_hours: 72

  # Rule 9 — internet outage + APT activity
  outage_apt:
    apt_window_days: 30

  # Rule 10 — multi-signal convergence (fusion)
  multi_signal_convergence:
    risk_score_threshold: 40.0
    gdelt_negative_threshold: 100
    goldstein_threshold: -3.0
    prediction_shift_threshold: 0.05
    spending_yoy_threshold: 10.0
    min_signals: 3
    # The GDELT signal also fires statistically: z-score above this
    # threshold with at least gdelt_zscore_floor events (catches unusual
    # deterioration in countries that never reach the absolute count).
    gdelt_zscore_threshold: 2.0
    gdelt_zscore_floor: 25

alerting:
  # Suppress a re-notification for the same (rule, countries, severity)
  # within this window.
  dedup_window_days: 7

ingestion:
  gdelt:
    # Catch-up ceiling when the ingestor was down: at most this many
    # missed 15-minute windows are backfilled per run (96 = 24 hours).
    max_backfill_windows: 96

  polymarket:
    # The Gamma API rejects pagination past an offset cap with HTTP 422
    # (its active-market catalogue exceeds 10k). We treat that 422 as a
    # clean end-of-results AND stop after this many pages of 100 as a
    # safety net (120 pages = 12k markets, above the current cap).
    max_pages: 120

risk_score:
  # Weighted composite (weights should sum to 1.0).
  weights:
    gdelt: 0.25
    acled: 0.15
    sanctions: 0.10
    apt: 0.15
    correlations: 0.20
    military_spending: 0.10
    arms_imports: 0.05
  # Normalization anchors per component: [low, mid, high] raw counts
  # mapping to scores of ~0 / 50 / 100.
  normalization:
    gdelt: [100, 1000, 5000]
    acled: [10, 100, 500]
    sanctions: [5, 50, 200]
    apt: [1, 3, 10]
    correlations: [1, 5, 20]
    military_spending: [5, 15, 30]
    arms_imports: [500, 3000, 10000]
  # Score boundaries for risk levels.
  levels:
    critical: 75
    high: 50
    medium: 25
  # Countries scored daily (GEON canonical names).
  target_countries:
    - "UNITED STATES"
    - "RUSSIA"
    - "CHINA"
    - "IRAN"
